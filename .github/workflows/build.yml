name: Build ZMK Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip ninja-build git wget
          pip3 install west

      - name: Clone ZMK
        run: |
          git clone --recursive https://github.com/zmkfirmware/zmk.git zmk-source

      - name: Build firmware
        run: |
          cd zmk-source
          west build -s app -b nice_nano_v2 -- -DZMK_CONFIG=/home/runner/work/zmk-config/zmk-config/config/pncateho-custom1.conf

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: zmk-source/build/zephyr/zmk.uf2
