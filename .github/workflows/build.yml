name: ZMK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git cmake ninja-build gperf ccache dfu-util device-tree-compiler wget python3-pip python3-setuptools python3-wheel

    - name: Install Python requirements
      run: |
        pip3 install --upgrade pip
        pip3 install -r zmk-source/zephyr/scripts/requirements.txt

    - name: Install Zephyr SDK v0.17.4
      run: |
        wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.4/zephyr-sdk-0.17.4_linux-x86_64.tar.xz
        tar -xf zephyr-sdk-0.17.4_linux-x86_64.tar.xz -C $HOME
        echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk-0.17.4_linux-x86_64" >> $GITHUB_ENV

    - name: Set Zephyr base
      run: |
        cd zmk-source
        west init -l .
        west update
        west zephyr-export

    - name: Build firmware
      run: |
        cd zmk-source
        mkdir -p build
        cd build
        cmake -B . -S ../app -DBOARD=nice_nano_v2 -DZMK_CONFIG=$GITHUB_WORKSPACE/config/pncateho-custom1.conf
        ninja

    - name: Archive firmware
      uses: actions/upload-artifact@v4
      with:
        name: zmk-uf2
        path: zmk-source/build/zephyr/zmk.uf2

