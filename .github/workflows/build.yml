name: Build ZMK Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip ninja-build git wget cmake gperf ccache device-tree-compiler
          pip3 install west

      - name: Install Zephyr SDK
        run: |
          wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.1/zephyr-sdk-0.16.1-linux-x86_64-setup.run
          chmod +x zephyr-sdk-0.16.1-linux-x86_64-setup.run
          sudo ./zephyr-sdk-0.16.1-linux-x86_64-setup.run -- -d $HOME/zephyr-sdk
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk" >> $GITHUB_ENV

      - name: Clone ZMK
        run: |
          git clone --recursive https://github.com/zmkfirmware/zmk.git zmk-source
          cd zmk-source
          west init -l app
          west update
          west zephyr-export

      - name: Build firmware via CMake
        run: |
          cd zmk-source
          mkdir -p build
          cd build
          cmake -B . -S ../app -DBOARD=nice_nano_v2 -DZMK_CONFIG=/home/runner/work/zmk-config/zmk-config/config/pncateho-custom1
          ninja

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: zmk-source/build/zephyr/zmk.uf2
